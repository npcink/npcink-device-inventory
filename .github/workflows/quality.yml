name: Quality checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    name: WordPress plugin quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: "8.3"
          tools: composer:v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vite-admin/package-lock.json
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer validate --strict
      - run: composer audit --locked
      - run: npm run check:versions
      - run: |
          find . -maxdepth 1 -name '*.php' -print0 | xargs -0 -n1 php -l
          find admin includes -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer run phpcs
      - run: composer run phpstan
      - run: npm run check:fixtures

  admin:
    name: Admin frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vite-admin
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vite-admin/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check:hardware-audit
      - run: npm run lint
      - run: npm run build
      - run: npm run check:bundle-budget
        working-directory: .

  desktop:
    name: Desktop quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ele-rs/package-lock.json
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci --prefix ele-rs
      - run: npm audit --prefix ele-rs --audit-level=high
      - run: cargo fmt --manifest-path ele-rs/Cargo.toml -- --check
      - run: cargo clippy --manifest-path ele-rs/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path ele-rs/Cargo.toml --locked
      - run: cargo fmt --manifest-path ele-rs/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path ele-rs/src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path ele-rs/src-tauri/Cargo.toml --locked

  package:
    name: Release package checks
    runs-on: ubuntu-latest
    needs: [plugin, admin]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vite-admin/package-lock.json
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: "8.3"
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci --prefix vite-admin
      - run: npm run build:release
      - run: npm run check:package
      - run: npm run check:release-scope
