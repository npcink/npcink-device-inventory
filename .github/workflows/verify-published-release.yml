name: Verify published candidate

on:
  release:
    types: [published]

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install --yes minisign
      - name: Verify public candidate bytes
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: npm run check:published-release -- published-assets
      - name: Verify desktop signatures when present
        run: |
          if find published-assets -name '*.exe' -print -quit | grep -q .; then
            npm run check:desktop-manifests -- published-assets
            npm run check:release-assets -- published-assets
          fi
