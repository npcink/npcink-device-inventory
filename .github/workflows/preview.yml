name: Build preview packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Choose what to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - plugin
          - desktop
          - macos
          - windows

permissions:
  contents: read

jobs:
  wordpress-plugin:
    name: WordPress plugin zip
    if: ${{ inputs.package == 'all' || inputs.package == 'plugin' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vite-admin/package-lock.json

      - name: Setup PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Composer dependency audit
        run: composer audit --locked

      - name: Check version contract
        run: npm run check:versions

      - name: PHP syntax check
        run: |
          php -v
          php -l npcink-device-inventory.php
          php -l uninstall.php
          php -l index.php
          find admin includes -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: PHP coding standards
        run: composer phpcs

      - name: PHP static analysis
        run: composer phpstan

      - name: Plugin regression fixtures
        run: npm run check:fixtures

      - name: Build admin app
        working-directory: vite-admin
        run: |
          npm ci
          npm audit --audit-level=high
          npm run check:hardware-audit
          npm run lint
          npm run build

      - name: Package plugin
        run: bash .github/scripts/package-wordpress-plugin.sh

      - name: Plugin Check
        uses: wordpress/plugin-check-action@98a1788320dadd90df2d8183934ecccbc4e05d2
        with:
          build-dir: ./release/npcink-device-inventory

      - name: Upload plugin artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-npcink-device-inventory-plugin
          path: release/npcink-device-inventory.zip
          if-no-files-found: error
          retention-days: 7

  desktop-macos:
    name: Desktop agent (macOS)
    if: ${{ inputs.package == 'all' || inputs.package == 'desktop' || inputs.package == 'macos' }}
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ele-rs/package-lock.json

      - name: Install frontend dependencies
        working-directory: ele-rs
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Use stable Rust
        run: rustup show

      - name: Check Rust collector
        working-directory: ele-rs
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Check Tauri shell
        working-directory: ele-rs/src-tauri
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Build desktop frontend
        working-directory: ele-rs
        run: npm run build

      - name: Build Tauri bundle
        working-directory: ele-rs
        run: npm run tauri:build

      - name: Upload macOS DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-npcink-device-agent-macos
          path: ele-rs/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

  desktop-windows:
    name: Desktop agent (Windows)
    if: ${{ inputs.package == 'all' || inputs.package == 'desktop' || inputs.package == 'windows' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ele-rs/package-lock.json

      - name: Install frontend dependencies
        working-directory: ele-rs
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Use stable Rust
        run: rustup show

      - name: Check Rust collector
        working-directory: ele-rs
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Check Tauri shell
        working-directory: ele-rs/src-tauri
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Build desktop frontend
        working-directory: ele-rs
        run: npm run build

      - name: Build Tauri bundle
        working-directory: ele-rs
        run: npm run tauri:build

      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-npcink-device-agent-windows
          path: ele-rs/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
